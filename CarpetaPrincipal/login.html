<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de inicio de sesión de Food Store">
  <title>Iniciar sesión | Food Store</title>
  <link rel="stylesheet" href="./CSS/login.css">
</head>
<body>
  <main class="login-layout">
    <section class="login-card" aria-labelledby="titulo-login">
      <header class="login-header">
        <h1 id="titulo-login">Food Store</h1>
        <p>Iniciar sesión</p>
      </header>

      <form class="login-form" action="#" method="post">
        <div class="form-field">
          <label for="email">Email:</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <label for="password">Contraseña:</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Mínimo 8 caracteres"
            minlength="8"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit">Ingresar</button>
      </form>

      <p class="register-link">¿No tenés cuenta? <a href="#registro">Registrate acá</a></p>
    </section>
  </main>
</body>
</html>
